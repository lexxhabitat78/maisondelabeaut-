<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maison de la Beauté — Onglerie &amp; Réservation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --surface-soft: #F3EFEA;
      --border: #E6DDD2;
      --ink: #1F1B18;
      --muted: #6C6259;
      --gold-dark: #9A743B;
      --gold: #C29B5E;
      --gold-light: #DFC293;
      --ok: #2E6F4E;
      --ok-bg: #ECF6F0;
      --warn: #8A5A16;
      --warn-bg: #FDF5E6;
      --danger: #992D2D;
      --danger-bg: #FDECEC;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(31, 27, 24, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .container {
      width: min(1080px, 92vw);
      margin: 0 auto;
    }

    /* En-tête */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 248, 245, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-lotus {
      width: 40px;
      height: 34px;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-primary {
      background: var(--ink);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #332C27;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: var(--ink);
      font-weight: 600;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--ink);
    }

    .btn-outline:hover {
      background: var(--surface-soft);
    }

    .btn-sm {
      padding: 7px 13px;
      font-size: 0.8rem;
    }

    /* Section principale */
    .hero {
      padding: 64px 0 52px;
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.9fr;
      gap: 40px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--gold-dark);
    }

    .hero-lead {
      font-size: 1.02rem;
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 28px;
    }

    .hero-cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
    }

    .info-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--surface-soft);
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-dark);
      font-weight: 600;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .info-value a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
    }

    /* Sections */
    section.block {
      padding: 60px 0;
      border-bottom: 1px solid var(--border);
    }

    .section-head {
      margin-bottom: 30px;
    }

    .section-head h2 {
      font-size: clamp(2rem, 3.6vw, 2.8rem);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .section-head p {
      color: var(--muted);
      font-size: 0.96rem;
    }

    /* Grille tarifaire */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .service-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .service-card.selected {
      border-color: var(--gold-dark);
      background: #FFFEFC;
      box-shadow: 0 0 0 1px var(--gold-dark), var(--shadow);
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .service-name {
      font-size: 1.02rem;
      font-weight: 600;
    }

    .service-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .service-price {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--gold-dark);
      white-space: nowrap;
    }

    .extras-box {
      margin-top: 24px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }

    .extras-title {
      font-size: 1.25rem;
      margin-bottom: 14px;
    }

    .extras-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .extra-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .extra-pill.selected {
      border-color: var(--gold-dark);
      background: #FBF6EE;
      font-weight: 500;
    }

    .extra-pill input {
      accent-color: var(--gold-dark);
    }

    /* Réservation */
    .booking-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: start;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
