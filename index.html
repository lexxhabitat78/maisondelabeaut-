<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maison de la Beauté — Onglerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#FAF8F5;--surface:#fff;--soft:#F3EFEA;--border:#E6DDD2;--ink:#1F1B18;--muted:#6C6259;--gold-d:#9A743B;--gold:#C29B5E;--gold-l:#DFC293;--ok-bg:#ECF6F0;--danger:#992D2D;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
.container{width:min(1080px,92vw);margin:0 auto}

/* Animation d'ouverture visible ~2,5s avec logo Maison de la Beauté */
#introSplash{position:fixed;inset:0;z-index:99999;background:#FAF8F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:1;transform:translateY(0);transition:opacity .5s ease,transform .55s cubic-bezier(.22,1,.36,1)}
#introSplash.leave{opacity:0;transform:translateY(-24px)}
#introSplash.gone{display:none}
.intro-logo{width:104px;height:86px;animation:introLogoAnim 1.1s cubic-bezier(.22,1,.36,1) both,introFloat 1.2s ease-in-out 1.05s infinite alternate}
.intro-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.25rem;font-weight:600;color:#1F1B18;animation:introTextAnim .95s ease .15s both}
.intro-sub{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:#9A743B;font-weight:600;animation:introTextAnim .95s ease .3s both}
.intro-bar{width:150px;height:2px;background:#E6DDD2;border-radius:999px;overflow:hidden;margin-top:4px}
.intro-bar>span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#DFC293,#9A743B);transform-origin:left;animation:introProgress 2.2s ease-out forwards}
@keyframes introLogoAnim{0%{opacity:0;transform:scale(.72) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes introFloat{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-6px) scale(1.04)}}
@keyframes introTextAnim{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes introProgress{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

header{position:sticky;top:0;z-index:100;background:rgba(250,248,245,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px}
.brand-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.4rem;font-weight:600;line-height:1.1}
.brand-sub{font-size:.75rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:999px;border:1px solid transparent;font:500 .88rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;color:var(--ink)}
.btn-primary{background:var(--ink);color:#fff}
.btn-gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));font-weight:600}
.btn-outline{background:transparent;border-color:var(--border)}
.btn-sm{padding:7px 13px;font-size:.8rem}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.hero{padding:60px 0 50px;border-bottom:1px solid var(--border)}
.hero-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.5rem,5vw,4rem);line-height:1.05;margin-bottom:16px}
.hero h1 em{font-style:italic;color:var(--gold-d)}
.lead{color:var(--muted);max-width:540px;margin-bottom:26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px;box-shadow:0 10px 30px rgba(31,27,24,.05)}
.row{padding:12px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border:0;padding-bottom:0}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-d);font-weight:600}
.row a{color:var(--ink);font-weight:600;text-decoration:none}
section.block{padding:56px 0;border-bottom:1px solid var(--border)}
.head{margin-bottom:28px}
.head h2{font-size:clamp(2rem,3.6vw,2.8rem);line-height:1.1;margin-bottom:6px}
.head p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.srv{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px;cursor:pointer}
.srv.sel{border-color:var(--gold-d);box-shadow:0 0 0 1px var(--gold-d)}
.srv-top{display:flex;justify-content:space-between;gap:12px}
.srv-name{font-weight:600}
.srv-meta{font-size:.82rem;color:var(--muted)}
.price{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.45rem;font-weight:600;color:var(--gold-d);white-space:nowrap}
.extras{margin-top:22px;background:var(--soft);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.extras h3{font-size:1.25rem;margin-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem}
.pill.sel{border-color:var(--gold-d);background:#FBF6EE}
.pill input{accent-color:var(--gold-d)}
.booking{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.84rem;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);border-color:var(--gold-d)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{padding:9px 6px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font:500 .85rem inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.slot.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sum{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:.92rem;border-bottom:1px dashed var(--border)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-weight:60
