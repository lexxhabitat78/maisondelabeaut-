<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maison de la Beauté — Onglerie &amp; Réservation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --surface-soft: #F3EFEA;
      --border: #E6DDD2;
      --ink: #1F1B18;
      --muted: #6C6259;
      --gold-dark: #9A743B;
      --gold: #C29B5E;
      --gold-light: #DFC293;
      --ok: #2E6F4E;
      --ok-bg: #ECF6F0;
      --warn: #8A5A16;
      --warn-bg: #FDF5E6;
      --danger: #992D2D;
      --danger-bg: #FDECEC;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(31, 27, 24, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* Splash screen avec glissement vers le bas */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    #splash.slide-down {
      transform: translateY(100%);
      opacity: 0.95;
      pointer-events: none;
    }

    .splash-lotus {
      width: 92px;
      height: 76px;
      animation: lotusPop 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .splash-title {
      font-size: 2rem;
      color: var(--ink);
      animation: fadeUp 0.8s ease 0.12s both;
    }

    @keyframes lotusPop {
      from {
        opacity: 0;
        transform: scale(0.86) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      width: min(1080px, 92vw);
      margin: 0 auto;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-lotus {
      width: 40px;
      height: 34px;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--ink);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #332C27;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: var(--ink);
      font-weight: 600;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--ink);
    }

    .btn-outline:hover {
      background: var(--surface-soft);
    }

    .btn-sm {
      padding: 7px 13px;
      font-size: 0.8rem;
    }

    /* Hero aéré */
    .hero {
      padding: 68px 0 56px;
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.9fr;
      gap: 40px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--gold-dark);
    }

    .hero-lead {
      font-size: 1.02rem;
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 28px;
    }

    .hero-cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
    }

    .info-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--surface-soft);
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-dark);
      font-weight: 600;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .info-value a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
    }

    /* Sections */
    section.block {
      padding: 64px 0;
      border-bottom: 1px solid var(--border);
    }

    .section-head {
      margin-bottom: 32px;
    }

    .section-head h2 {
      font-size: clamp(2rem, 3.6vw, 2.8rem);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .section-head p {
      color: var(--muted);
      font-size: 0.96rem;
    }

    /* Grille tarifaire */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .service-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .service-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .service-card.selected {
      border-color: var(--gold-dark);
      background: #FFFEFC;
      box-shadow: 0 0 0 1px var(--gold-dark), var(--shadow);
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .service-name {
      font-size: 1.02rem;
      font-weight: 600;
    }

    .service-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .service-price {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--gold-dark);
      white-space: nowrap;
    }

    .extras-box {
      margin-top: 24px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }

    .extras-title {
      font-size: 1.25rem;
      margin-bottom: 14px;
    }

    .extras-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .extra-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .extra-pill.selected {
      border-color: var(--gold-dark);
      background: #FBF6EE;
      font-weight: 500;
    }

    .extra-pill input {
      accent-color: var(--gold-dark);
    }

    /* Réservation */
    .booking-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: start;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.92rem;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--gold-dark);
      background: #FFFFFF;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 8px;
    }

    .slot-btn {
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .slot-btn.active {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 0.92rem;
      border-bottom: 1px dashed var(--border);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 14px;
      margin-top: 8px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .summary-total .amount {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.7rem;
      color: var(--gold-dark);
    }

    .confirm-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: var(--ok-bg);
      border: 1px solid #B8DEC8;
      color: var(--ink);
      display: none;
    }

    .confirm-box.visible {
      display: block;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    /* Accès équipe */
    .staff-section {
      padding: 56px 0 64px;
      background: var(--surface-soft);
    }

    .staff-panel {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      display: none;
    }

    .staff-panel.open {
      display: block;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .stat-num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--ink);
    }

    .stat-lbl {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-pending {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .badge-confirmed {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .badge-cancelled {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      color: var(--ok);
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Footer */
    footer {
      background: var(--ink);
      color: #EAE3DA;
      padding: 36px 0;
      font-size: 0.88rem;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    footer a {
      color: var(--gold-light);
      text-decoration: none;
    }

    @media (max-width: 820px) {
      .hero-grid,
      .booking-grid,
      .form-row-2 {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 44px 0 40px;
      }
    }
